sonar.projectKey=Jylhis_paperclip
sonar.organization=jylhis

# Name displayed in the SonarCloud UI.
sonar.projectName=paperclip

# ---------------------------------------------------------------------------
# Source layout
# ---------------------------------------------------------------------------
# Production TypeScript/JavaScript lives under these roots. The Dockerfiles and
# workflow files are included so the hadolint/actionlint external issues (and
# SonarCloud's own Docker/Actions analysis) have indexed files to attach to.
# Tests, build output and generated files are removed via sonar.exclusions below.
sonar.sources=server/src,ui/src,cli/src,packages,Dockerfile,docker,.github/workflows
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,**/__tests__/**,**/__mocks__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.ts,**/*.stories.tsx,**/storybook/**,**/vitest.setup.ts,**/*.config.ts,**/*.config.mts,**/*.config.mjs,packages/plugins/sandbox-providers/**
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# JavaScript / TypeScript analyzer
# ---------------------------------------------------------------------------
sonar.javascript.file.suffixes=.js,.jsx,.cjs,.mjs
sonar.typescript.file.suffixes=.ts,.tsx,.cts,.mts
# Runtimes the code targets: the server/cli run on Node, the UI runs in the browser.
sonar.javascript.environments=browser,node
# No project-wide implicit globals; rely on environments above.
sonar.javascript.globals=
# Vite entry point (ui/index.html) carries inline scripts worth analyzing.
sonar.javascript.html.file.suffixes=.html
# Additional extensions treated as CSS (defaults already cover .css/.less/.scss).
sonar.javascript.css.additional.file.suffixes=.css
# Do not raise issues inside file header/license comment blocks.
sonar.javascript.ignoreHeaderComments=true

# ---------------------------------------------------------------------------
# Scanner runtime
# ---------------------------------------------------------------------------
# Reuse the Node.js runtime already provisioned on the CI runner instead of
# letting the scanner download its own.
sonar.scanner.skipNodeProvisioning=true

# ---------------------------------------------------------------------------
# Test coverage
# ---------------------------------------------------------------------------
# Default path; CI overrides this with the merged set of per-shard lcov reports
# via -Dsonar.javascript.lcov.reportPaths (see .github/workflows/sonarqube.yml).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ---------------------------------------------------------------------------
# External analyzer reports
# ---------------------------------------------------------------------------
# Dockerfile linting (hadolint -f json) imported by the Docker/IaC analyzer.
sonar.docker.hadolint.reportPaths=hadolint-report.json
# GitHub Actions workflow linting (actionlint) imported as generic external issues.
sonar.externalIssuesReportPaths=actionlint-sonar.json
